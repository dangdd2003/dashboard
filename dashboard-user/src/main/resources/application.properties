quarkus.http.port=8081
quarkus.http.host=0.0.0.0

# Every JAX-RS endpoint must carry an explicit security annotation
quarkus.security.jaxrs.deny-unannotated-endpoints=true

# Datasource configuration
# dev: local MySQL as root without password; prod: credentials from the environment.
# test: no URL configured -> Quarkus Dev Services starts a throw-away MySQL container.
quarkus.datasource.db-kind=mysql
%dev.quarkus.datasource.jdbc.url=jdbc:mysql://localhost:3306/user_management
%dev.quarkus.datasource.username=root
%dev.quarkus.datasource.password=
%prod.quarkus.datasource.jdbc.url=${DB_URL:jdbc:mysql://localhost:3306/user_management}
%prod.quarkus.datasource.username=${DB_USER:dashboard}
%prod.quarkus.datasource.password=${DB_PASSWORD:}

# Schema management: auto-update in dev only; prod validates unless DB_SCHEMA_STRATEGY says otherwise
%dev.quarkus.hibernate-orm.schema-management.strategy=update
%prod.quarkus.hibernate-orm.schema-management.strategy=${DB_SCHEMA_STRATEGY:validate}
%dev.quarkus.hibernate-orm.log.sql=true

# JWT configuration (see keygen.sh)
# This service holds the SIGNING public key and the ENCRYPTION private key only.
jwt.key-dir=${JWT_KEY_DIR:../jwt}
mp.jwt.verify.issuer=dashboard-user
mp.jwt.verify.audiences=dashboard-api
mp.jwt.verify.publickey.location=file:${jwt.key-dir}/sign-public.pem
mp.jwt.decrypt.key.location=file:${jwt.key-dir}/enc-private.pem

# CORS configuration
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:3000}
%dev.quarkus.http.cors.origins=*
quarkus.http.cors.headers=Content-Type,Authorization,Accept,Origin
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS

# Swagger UI is served in dev mode only (Quarkus default; do not set always-include)

# Upload limits (models / resources can be large)
quarkus.http.limits.max-body-size=100M
quarkus.http.limits.max-form-attribute-size=100M

# Python ML service (REST client "python-service")
quarkus.rest-client.python-service.url=${PYTHON_SERVICE_URL:http://localhost:5000}
quarkus.rest-client.python-service.connect-timeout=5000
quarkus.rest-client.python-service.read-timeout=300000

# Data folder for model / resource / avatar files (absolute path recommended in containers)
system.folder=${SYSTEM_FOLDER:GroupProject}
